<title>Bounty Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mobile app shell — sticky search bar, card grid, bottom tab bar; on wide screens the deck sits in a right-hand panel. */
:root{
  --bg:#E4D8C0; --surface:#EFE6D3; --sunk:#D9CCB1; --ink:#2B2620; --muted:#6B6150; --line:#BFAF8E;
  --accent:#7A5800; --accent-fill:#E8BC2E; --on-accent:#231800;
  --ok:#1E6B3E; --warn:#85500A; --bad:#A3232A;
  --t-red:#A3232A; --t-green:#1E6B3E; --t-blue:#1F5A9E; --t-purple:#6B3696; --t-black:#2B2620; --t-yellow:#7A5800;
  --c-red:#D1343A; --c-green:#2A9358; --c-blue:#2E6FBA; --c-purple:#8646B5; --c-black:#3A4047; --c-yellow:#DDAA16;
  --shadow:0 1px 2px rgba(43,38,32,.08),0 6px 18px rgba(43,38,32,.10);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12110F; --surface:#1C1A17; --sunk:#161412; --ink:#EFE9DD; --muted:#A39A89; --line:#3A352E;
  --accent:#EDBE52; --accent-fill:#EDBE52; --on-accent:#1E1500;
  --ok:#4CC083; --warn:#E3A645; --bad:#F06A6E;
  --t-red:#F06A6E; --t-green:#4CC083; --t-blue:#6AA5E8; --t-purple:#B884E0; --t-black:#C9C2B4; --t-yellow:#EDBE52;
  --c-red:#E5484E; --c-green:#3CB872; --c-blue:#4C8EDB; --c-purple:#A46BD3; --c-black:#8C96A1; --c-yellow:#E8BC2E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12110F; --surface:#1C1A17; --sunk:#161412; --ink:#EFE9DD; --muted:#A39A89; --line:#3A352E;
  --accent:#EDBE52; --accent-fill:#EDBE52; --on-accent:#1E1500;
  --ok:#4CC083; --warn:#E3A645; --bad:#F06A6E;
  --t-red:#F06A6E; --t-green:#4CC083; --t-blue:#6AA5E8; --t-purple:#B884E0; --t-black:#C9C2B4; --t-yellow:#EDBE52;
  --c-red:#E5484E; --c-green:#3CB872; --c-blue:#4C8EDB; --c-purple:#A46BD3; --c-black:#8C96A1; --c-yellow:#E8BC2E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark }
:root[data-theme="stone"]{
  --bg:#A89C86; --surface:#B9AE99; --sunk:#9C907A; --ink:#1F1B16; --muted:#3E372D; --line:#857A66;
  --accent:#4F3900; --accent-fill:#E8BC2E; --on-accent:#231800;
  --ok:#12502D; --warn:#5E3A06; --bad:#7E1A20;
  --t-red:#7E1A20; --t-green:#12502D; --t-blue:#163F70; --t-purple:#4F2570; --t-black:#1F1B16; --t-yellow:#4F3900;
  --shadow:0 1px 2px rgba(31,27,22,.12),0 6px 18px rgba(31,27,22,.14); color-scheme:light }
html{background:var(--bg)}
#bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-repeat:no-repeat;display:none}
html[data-photo] #bgimg{display:block}
html[data-photo] body{background:transparent}
html[data-photo]{--frost:color-mix(in srgb, var(--bg) 46%, transparent);--glow:0 0 2px var(--bg),0 0 8px var(--bg)}
html[data-photo] .dtitle,html[data-photo] .lrow b,html[data-photo] .ctags,html[data-photo] .poollink,html[data-photo] .resbar,html[data-photo] .hsl,html[data-photo] .recentbtn,html[data-photo] .sect,html[data-photo] .note,html[data-photo] .junklink,html[data-photo] .brand h1{text-shadow:var(--glow)}
html[data-photo] .brandbar,html[data-photo] .top,html[data-photo] .nav,html[data-photo] .aside{background:var(--frost)!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
html[data-photo] .dtitle,html[data-photo] .lrow,html[data-photo] .dempty,html[data-photo] #homeStrip:not(:empty),html[data-photo] #leaderBanner:not(:empty){background:var(--frost);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:14px;padding:6px 10px;margin-inline:-10px}
html[data-photo] .dtitle{display:inline-block;padding:4px 12px 6px}
html[data-photo] .fpill:not([aria-pressed="true"]),html[data-photo] .roundbtn,html[data-photo] .newtile{background:var(--frost);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
html[data-photo] #v-lists,html[data-photo] #bHead,html[data-photo] #bBody,html[data-photo] #v-decks[data-mode="pool"]{background:color-mix(in srgb, var(--bg) 62%, transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* Look sheet */
.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.looks button{display:grid;gap:6px;justify-items:center;background:none;border:0;padding:0;font-size:12.5px;font-weight:700;color:var(--ink)}
.looks .sw{width:100%;aspect-ratio:3/4;border-radius:12px;border:1px solid var(--line)}
.looks button[aria-pressed="true"] .sw,.bgthumbs button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.bgthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.bgthumbs button,.bgthumbs label{aspect-ratio:9/16;border-radius:10px;border:1px solid var(--line);background:var(--sunk) center/cover no-repeat;padding:0;position:relative;cursor:pointer}
.bgthumbs label{border-style:dashed;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:13px;text-align:center;line-height:1.2}
.bgthumbs label:focus-within{outline:2px solid var(--ink)}
.frame{position:relative;width:150px;aspect-ratio:9/19.5;border-radius:18px;border:1px solid var(--line);background:#222 center/cover no-repeat;touch-action:none;cursor:grab;margin:0 auto}
.frame span{position:absolute;inset:auto 0 8px;text-align:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg3 button{height:38px;padding:0 14px;border:0;background:transparent;font-weight:700;font-size:13.5px;color:var(--ink)}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.acdot{position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:5px;background:var(--ok);border:2px solid var(--surface)}
.acdot.warn{background:var(--warn)}
.fld input[type=email],.fld input[type=password]{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;color:var(--ink)}
.fld input[type=email]:focus,.fld input[type=password]:focus{border-color:var(--ink);outline:none}
.authmsg{font-size:13.5px;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.authmsg.bad{color:var(--bad)}
.choice{display:grid;gap:8px;margin-top:6px}
.twoplaces{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.twoplaces>div{padding:10px 12px;border-radius:12px;background:var(--sunk)}.twoplaces small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}.twoplaces b{font-size:14px}
.choice button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.choice button b{display:block;font-size:15px}
.choice button span{font-size:13px;color:var(--muted)}
@media (max-width:440px){.brand{gap:8px}.brand .pose{display:none}.brand h1{font-size:17px;letter-spacing:0}.deckchip .nm{display:none}.deckchip{padding:3px;flex:none;max-width:none}}
.scrim.clear{background:transparent}
.sheet.seethru{background:color-mix(in srgb, var(--surface) 58%, transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet.seethru .ebhead b,.sheet.seethru .fld > span,.sheet.seethru p{text-shadow:0 0 2px var(--surface),0 0 8px var(--surface)}
.brand .lookbtn{position:relative;flex:none;width:34px;height:34px;border-radius:17px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--ink)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.main{min-width:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.aside{display:none}
@media (min-width:1024px){
  /* Computer: tabs live in the top bar; pages are full width; the builder is two panels (search | deck) */
  .app{grid-template-columns:minmax(0,1fr)}
  html.building .app{grid-template-columns:clamp(380px,36vw,560px) minmax(0,1fr)}
  html.building .aside{display:block;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;border-left:1px solid var(--line);background:var(--surface)}
  .tab-deck{display:none!important}
  .main{padding-bottom:84px}
  html.building .aside{padding-bottom:84px;border-left:1px solid var(--line)}
  html.building #v-cards .top .chips{flex-wrap:wrap;overflow:visible}
  html.building #grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))!important;gap:8px}
  html.building #grid .nm{font-size:12px}html.building #grid .ty,html.building #grid .fx,html.building #grid .cat{display:none}
  html.building #grid .band{padding:3px 5px}html.building #grid .cost{width:20px;height:20px;font-size:13px}html.building #grid .pow{font-size:11px}
  html.building #asideDeck{max-width:none}
  html.building #asideDeck .dgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  html.building .bldbar .muted{display:none}
  html:not(.building) #v-cards, #v-decks, #v-lists{max-width:1240px;margin-inline:auto}
  html.building #bgimg{right:0}
}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.topnav{display:none;gap:4px;margin-left:18px}
.topnav a{padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:700;font-size:15px;text-decoration:none;position:relative}
.topnav a:hover{color:var(--ink);background:var(--sunk)}
.topnav a[aria-current="page"]{color:var(--ink)}
.topnav a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px;background:var(--accent-fill)}

.brand h1{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand .pose{width:22px;height:22px;flex:none}
.deckchip{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 6px 4px 10px;min-width:0;max-width:52%}
.deckchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:13px}
.count{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--surface);border-radius:999px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.count.full{background:var(--accent-fill);color:var(--on-accent);border-color:transparent}
.searchrow{display:flex;gap:8px;padding-block:6px 8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 36px 0 36px;font-size:16px}
.search svg{position:absolute;left:10px;top:11px;width:20px;height:20px;color:var(--muted)}
.search .clr{position:absolute;right:4px;top:5px;width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--muted)}
.iconbtn{height:42px;min-width:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;position:relative;font-weight:700;font-size:13px}
.iconbtn svg{width:20px;height:20px}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--accent-fill);color:var(--on-accent);border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .dot{width:12px;height:12px;border-radius:50%}
.chip.color{padding:0 10px}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

/* ---------- results ---------- */
.resbar{display:flex;align-items:center;gap:10px;padding-block:2px 8px;flex-wrap:wrap;font-size:14px}
.resbar select{height:32px;font-size:13.5px}
.resbar .n{font-weight:700}
@media (max-width:420px){.resbar label[for=sort]{display:none}.resbar select{max-width:138px}}
.resbar select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:13px;margin-left:auto}
.note{font-size:13px;color:var(--muted);padding-block:2px 6px}
.note button{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.banner{margin-block:8px;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent-fill) 14%,var(--surface));border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner .btn{margin-left:auto}
.grid{display:grid;gap:10px;padding-block:6px 16px}
.grid[data-size="l"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid[data-size="s"]{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (min-width:640px){.grid[data-size="l"]{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.grid[data-size="s"]{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}}
.sect{grid-column:1/-1;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);padding-top:8px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{grid-column:1/-1;text-align:center;padding:40px 12px;color:var(--muted)}

/* ---------- card tile (text fallback; real art overlays when the host allows images) ---------- */
.tile{position:relative;border:0;padding:0;background:none;text-align:left;display:block;width:100%}
.face{position:relative;aspect-ratio:63/88;max-width:100%;border-radius:9px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;border:1px solid var(--line)}
.grid[data-size="s"] .face{border-radius:6px}
.band{height:30%;position:relative;padding:7px 8px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff}
.cost{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:rgba(0,0,0,.28);border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.cost.life{border-radius:7px;width:auto;padding:0 6px;font-size:15px}
.pow{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cat{position:absolute;left:8px;bottom:5px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.92}
.body{flex:1;padding:6px 8px 7px;display:flex;flex-direction:column;gap:3px;min-height:0}
.nm{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.05;text-wrap:balance}
.ty{font-size:11px;color:var(--muted);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fx{font-size:11px;line-height:1.3;color:var(--ink);opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;margin-top:2px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11px}
.ctr{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted)}
.grid[data-size="s"] .band{padding:4px 5px}
.grid[data-size="s"] .cost{width:22px;height:22px;font-size:15px}
.grid[data-size="s"] .cost.life{font-size:12px;padding:0 4px}
.grid[data-size="s"] .pow{font-size:12px}
.grid[data-size="s"] .cat,.grid[data-size="s"] .ty,.grid[data-size="s"] .fx,.grid[data-size="s"] .ctr{display:none}
.grid[data-size="s"] .body{padding:4px 5px}
.grid[data-size="s"] .nm{font-size:12.5px}
.grid[data-size="s"] .foot{font-size:9px}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface)}
.qty{position:absolute;right:-4px;top:-4px;z-index:2;background:var(--accent-fill);color:var(--on-accent);font-family:var(--f-display);font-weight:700;font-size:15px;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2px var(--bg)}
.grid[data-size="s"] .qty{min-width:20px;height:20px;font-size:12px}
.flag{position:absolute;left:4px;bottom:4px;z-index:2;font-size:10px;font-weight:700;border-radius:999px;padding:2px 6px;background:var(--surface);border:1px solid var(--line)}
.flag.ban{color:var(--bad);border-color:var(--bad)}
.flag.part{color:var(--warn);border-color:var(--warn)}
.flag.unk{color:var(--muted)}
.tile.dim .face{filter:grayscale(1);opacity:.42}
.tile.dim .flag{opacity:1}
.grid[data-size="s"] .flag{font-size:8px;padding:1px 4px}

/* ---------- panels / views ---------- */
.view{padding-block:12px}
.h2{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.h3{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent-fill);color:var(--on-accent);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.namein{font-family:var(--f-display);font-weight:700;font-size:24px;border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 6px;margin-left:-6px;width:100%;min-width:0}
.namein:hover,.namein:focus{border-color:var(--line);background:var(--bg)}
.leaderbox{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.leaderbox .sw{width:44px;height:60px;border-radius:6px;flex:none}
.leaderbox .jolly{width:48px;height:48px;flex:none;display:block}
.leaderbox .info{min-width:0;flex:1}
.issues{display:grid;gap:6px;margin-top:10px}
.issue{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;border-radius:10px;padding:8px 10px;background:var(--sunk)}
.issue i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.issue.bad i{background:var(--bad)} .issue.warn i{background:var(--warn)} .issue.ok i{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg{max-width:100%}

<script id="carddata" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
/* ================= data ================= */
const DATA = (() => {
  const raw = document.getElementById("carddata").textContent;
  if (raw.trim() === "__" + "DATA__"){
    // This is the app's source template (no card data inside). Point people to the real app instead of erroring.
    document.body.innerHTML = `<div style="max-width:520px;margin:12vh auto;padding:24px;font:16px/1.5 system-ui,sans-serif;color:#2B2620;background:#EFE6D3;border:1px solid #BFAF8E;border-radius:16px">
      <h1 style="margin:0 0 8px;font-size:22px">Bounty Board · source template</h1>
      <p style="margin:0 0 12px">This file is the app's blueprint, kept for building updates. It has no card data inside, so it can't run on its own.</p>
      <p style="margin:0"><a href="https://lilzeemadeit.github.io/Bounty-board/" target="_blank" rel="noopener" style="color:#2B2620;font-weight:700">Open the real app →</a></p></div>`;
    throw new Error("Source template only: open https://lilzeemadeit.github.io/Bounty-board/");
  }
  return JSON.parse(raw);
})();
const META = DATA.meta, CARDS = DATA.cards;
const BY = new Map(CARDS.map(c => [c.i, c]));
META.tags.push(["leadercond","Has a leader condition"]);
const TAGLABEL = Object.fromEntries(META.tags);
const CATNAME = {L:"Leader",C:"Character",E:"Event",S:"Stage"};
const COLORS = ["Red","Green","Blue","Purple","Black","Yellow"];
// Pictures go through Bounty Board's own relay (a Supabase function), because Bandai's site won't show them inside other sites.
const IMG_BASE = "https://ebsgqefxokkgihfjrvvh.supabase.co/functions/v1/card-img?id=";
let IMG_OK = null;               // null = untested, false = this host blocks card images
for (const c of CARDS){
  c._name = c.n.toLowerCase();
  c._id = c.i.toLowerCase(); c._idc = c._id.replace("-","");
  c._types = (c.t.join(" / ") + (c.a && c.a !== "Unknown" ? " / " + c.a : "")).toLowerCase();
  if (c.sg.some(s => s.c)) c.g.push("leadercond");
  c._text = (c.e + " " + c.tr).toLowerCase();
  c._tags = new Set(c.g);
  c._order = CARDS.indexOf(c);
}
// search words that mean an effect, not literal text
const SYN = {
  rest:["rest"],rests:["rest"],resting:["rest"],rested:["rest"],lock:["rest"],
  ko:["ko"],"k.o":["ko"],"k.o.":["ko"],kill:["ko"],destroy:["ko"],removal:["ko","bounce","bottom"],
  bounce:["bounce"],return:["bounce"],
  draw:["draw"],draws:["draw"],
  search:["search"],look:["search"],tutor:["search"],dig:["search"],
  ramp:["donadd"],
  restand:["active"],untap:["active"],
  debuff:["powdown"],buff:["powup"],
  discard:["discard"],protect:["protect"],protection:["protect"],negate:["negate"],
  recursion:["trash","play"],revive:["trash"],
  rush:["rush"],blocker:["blocker"],banish:["banish"],unblockable:["unblock"],trigger:["trigger"],
};
const SYN_DESC = {rest:"rest an opponent's card",ko:"K.O. a card",bounce:"return a card to hand",draw:"draw cards",search:"look at / search your deck",donadd:"add DON!!",active:"set cards as active",powdown:"reduce power",powup:"give power",discard:"make the opponent trash",protect:"protect your cards",negate:"negate effects",trash:"use your trash",play:"play cards from hand, trash or deck",rush:"have or give Rush",blocker:"have or give Blocker",banish:"have or give Banish",unblock:"have Unblockable",trigger:"have a Trigger",bottom:"send cards to the bottom of the deck"};

/* ================= storage ================= */
const KEY = "bountyboard.v1";
function load(){ try{ const s = localStorage.getItem(KEY) || localStorage.getItem("logpose.v1"); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} if (typeof cloudDirty === "function") cloudDirty(); }, 250); }
const uid = () => Math.random().toString(36).slice(2,9);

function sampleDeck(){
  const cards = {};
  const pool = CARDS.filter(c => c.s === "ST-01" && c.c !== "L");
  let n = 0;
  for (const c of pool){ const q = Math.min(4, 50-n); if (q<=0) break; cards[c.i] = {q}; n += q; }
  return {id:uid(), name:"Sample: Straw Hat Crew (ST-01 cards)", used: 0, leader:"ST01-001", cards, updated:Date.now(), sample:true};
}
let S = load() || {};
S.decks = (S.decks || []).filter(d => !d.sample);          // no sample decks: everyone starts with their own
const JUNK_DAYS = 7;                                         // deleted builds wait in the Junkyard this long
S.junk = (S.junk || []).filter(j => Date.now() - (j.deletedAt||0) < JUNK_DAYS*864e5);
S.cur = S.decks.find(d=>d.id===S.cur) ? S.cur : (S.decks[0] ? S.decks[0].id : null);
S.owned = S.owned || {};
S.wish = S.wish || [];
for (const w of S.wish){            // Buy Lists: {items: extra copies added by hand, decks: deck ids to buy for, mode}
  w.items = w.items || {};
  if (!w.decks){ w.decks = w.fromDeck ? [w.fromDeck] : []; if (w.fromDeck) w.items = {}; delete w.fromDeck; }
  w.mode = w.mode || "all";
}
S.treasure = S.treasure || [];
S.want = S.want || [];          // Wish List: cards you have your eye on (not tied to a build)
S.favLeaders = S.favLeaders || [];
S.pools = S.pools || {};      // leaderId -> {cards:{cardId: addedAt}}  (the ★ Leader Pool's own ideas)
S.prefs = Object.assign({grid:"l", sort:"rel", compat:true, matchLeader:true, pool:"all", arts:true}, S.prefs||{});
if (!S.prefs.artsV2){ S.prefs.arts = true; S.prefs.artsV2 = true; }   // all printings shown by default
save();
const NODECK = {id:null, name:"", leader:null, cards:{}, ghost:true};
const deck = () => S.decks.find(d=>d.id===S.cur) || NODECK;

/* ================= helpers ================= */
const $ = (s,el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const colorVar = c => `var(--c-${c.toLowerCase()})`;
function bandBg(c){ const cs = c.co.length ? c.co : ["Black"]; return cs.length===1 ? colorVar(cs[0]) : `linear-gradient(110deg, ${colorVar(cs[0])} 0 50%, ${colorVar(cs[1])} 50% 100%)`; }
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 1900); }
function deckCount(d){ let n=0; for (const k in d.cards) n += d.cards[k].q; return n; }
function limitFor(c){ return c.any ? 99 : 4; }
function leaderGroups(){
  const ids = [];
  for (const d of S.decks) if (d.leader && !ids.includes(d.leader)) ids.push(d.leader);
  for (const k of Object.keys(S.pools)) if (!ids.includes(k) && Object.keys(S.pools[k].cards||{}).length) ids.push(k);
  return { groups: ids.map(id => ({L: BY.get(id), decks: S.decks.filter(d=>d.leader===id)})).filter(g=>g.L),
           none: S.decks.filter(d=>!d.leader) };
}
function inPool(lid, id){ return !!(S.pools[lid] && S.pools[lid].cards[id]); }
function poolCards(lid){
  const map = new Map();
  const get = id => { if (!map.has(id)) map.set(id, {decks:[], idea:false}); return map.get(id); };
  for (const d of S.decks) if (d.leader === lid) for (const [id,v] of Object.entries(d.cards)) get(id).decks.push([d, v.q]);
  for (const id of Object.keys((S.pools[lid]||{}).cards||{})) if (BY.get(id)) get(id).idea = true;
  return map;
}
function sharesColor(c, L){ return !L || c.co.some(x => L.co.includes(x)); }
function fmtText(t){
  return esc(t)
    .replace(/\[(Trigger)\]/g,'<span class="kw trg">$1</span>')
    .replace(/\[([^\]]{1,40})\]/g,(m,k)=> /^(On |When |Activate|Main|Counter|Blocker|Rush|Banish|Double Attack|Once Per Turn|DON!!|Your Turn|Opponent's Turn|End of Your Turn|Unblockable|On Your Opponent)/.test(k) ? `<span class="kw">${k}</span>` : `<b>[${k}]</b>`)
    .replace(/\{([^}]{1,40})\}/g,'<span class="tyref">{$1}</span>');
}
const STD_PERMIT = new Set(META.stdPermitted), STD_B4 = new Set(META.stdBlock4);
function stdStatus(c){
  if (STD_PERMIT.has(c.i)) return {ok:true, note:"Bandai keeps this card legal in Standard whatever block icon is printed on it."};
  if (STD_B4.has(c.i)) return {ok:true, note:"Bandai counts this card as Block 4, so it's legal in Standard through March 31, 2029."};
  if (c.b === null || c.b >= 2) return {ok:true};
  return {ok:false, note:"Rotated out of Standard: Block 1 cards left Standard on April 1, 2026. It's still fine for Extra format and casual play. This is separate from the ban list."};
}
function standardOK(c){ return stdStatus(c).ok; }

/* ================= compatibility ================= */
function altOK(a, L){
  const [k,v] = a;
  if (k==="name") return L.n === v;
  if (k==="type") return L.t.includes(v);
  if (k==="typeinc") return L.t.some(t=>t.includes(v));
  if (k==="nameinc") return L.n.includes(v);
  if (k==="multi") return L.co.length > 1;
  if (k==="color") return L.co.includes(v);
  if (k==="attr") return L.a === v;
  return true;
}
const compatCache = new Map();
function compat(c){
  const d = deck(); const L = d && d.leader && BY.get(d.leader);
  if (!L || c.c === "L") return null;
  const key = L.i + "|" + c.i;
  if (compatCache.has(key)) return compatCache.get(key);
  let fails = [], primOK = 0, prim = 0, unk = false, still = [];
  for (const s of c.sg){
    if (s.u) unk = true;
    const ok = !s.c || s.c.some(a => altOK(a, L));
    if (s.k === "e"){ prim++; if (ok) primOK++; }
    if (!ok) fails.push(s);
  }
  if (!fails.length){
    const r = unk ? {st:"U", why:"Couldn't read one of this card's leader conditions. Check the card text."} : {st:"A"};
    compatCache.set(key, r); return r;
  }
  const byType = fails.some(f => f.c.some(a => a[0]!=="name" && a[0]!=="nameinc"));
  const conds = [...new Set(fails.map(f=>f.ct))];
  if (c._tags.has("blocker")) still.push("Blocker"); if (c._tags.has("rush")) still.push("Rush"); if (c.tr) still.push("Trigger");
  if (c.ct) still.push("+" + c.ct + " counter");
  let r;
  if (prim && primOK === 0){
    r = {st:"C", head: byType ? "Requires a different leader type" : "Requires a different leader",
         why: "Main effect needs: " + conds.join("; ") + "." + (still.length ? " Still usable: " + still.join(", ") + "." : "")};
  } else {
    r = {st:"B", head:"Conditional bonus unavailable",

/* ================= search ================= */
// Two searches share one engine: the Cards tab searches everything; the Build tab's "Add cards"
// searches for the open build, locked to its leader's colors until "Leader colors" is switched off.
const mkF = () => ({ q:"", colors:new Set(), cats:new Set(), costs:new Set(), counter:"any", tags:new Set(), blocks:new Set(), type:"", set:"", exact:false, lock:true });
const FC = mkF(); let FB = mkF();
let ctx = "cards", F = FC;
const isFav = id => S.favLeaders.includes(id);
function toggleFav(id){ const i = S.favLeaders.indexOf(id); if (i >= 0) S.favLeaders.splice(i,1); else S.favLeaders.unshift(id); save(); }
const usedAt = d => d.used || d.updated || 0;
const recentBuilds = () => [...S.decks].sort((a,b)=>usedAt(b)-usedAt(a));
function workOn(deckId){
  if (S.cur !== deckId){ FB = mkF(); if (ctx === "build"){ F = FB; qIn.value = ""; } }
  S.cur = deckId; const d = deck(); d.used = Date.now(); compatCache.clear(); save();
}
function tokens(q){ return q.toLowerCase().replace(/["“”„]/g, " ").trim().split(/\s+/).filter(Boolean); }
// "quoted words" must appear together; several unquoted words → cards with them together are shown first.
function parseQ(q){
  const quoted = [], low = q.toLowerCase().replace(/[“”„]/g, '"');
  const rest = low.replace(/"([^"]*)"?/g, (_, p) => { p = p.trim().replace(/\s+/g, " "); if (p) quoted.push(p); return " "; });
  const toks = rest.trim().split(/\s+/).filter(Boolean);
  return {toks, quoted, soft: !quoted.length && toks.length > 1 ? toks.join(" ") : null};
}
// Word-start match: "turn" finds "turn" and "turns" but not "return".
function wordAt(hay, w){
  let i = hay.indexOf(w);
  while (i >= 0){ if (i === 0 || !/[a-z0-9]/.test(hay[i-1])) return i; i = hay.indexOf(w, i + 1); }
  return -1;
}
const phraseIn = (c, p) => wordAt(c._text, p) >= 0 || wordAt(c._name, p) >= 0 || wordAt(c._types, p) >= 0;
function idQuery(t){ const m = t.match(/^([a-z]{1,3}\d{0,2})-?(\d{3})$/); return m ? (m[1]+"-"+m[2]) : null; }
let lastSynTags = [];
function scoreCard(c, toks){
  let total = 0;
  for (const t of toks){
    let s = 0;
    const idq = idQuery(t);
    if (idq && (c._id === idq || c._id.endsWith(idq))) s = 200;
    else if (c._id.includes(t) || c._idc.includes(t)) s = 120;
    if (c._name === t) s = Math.max(s, 90);
    else if (c._name.startsWith(t) || c._name.includes(" "+t) || c._name.includes("."+t)) s = Math.max(s, 60);
    else if (c._name.includes(t)) s = Math.max(s, 40);
    if (c._types.includes(t)) s = Math.max(s, 30);
    const syn = !F.exact && SYN[t];
    if (syn){ if (syn.some(g => c._tags.has(g))) s = Math.max(s, 35); }
    else if (s === 0){
      if (wordAt(c._text, t) >= 0) s = 12;
    }
    if (s === 0) return -1;
    total += s;
  }
  return total;
}
function passFilters(c, L, hideLeaders){
  if (F.cats.size){ if (!F.cats.has(c.c)) return false; }
  else if (hideLeaders && c.c === "L") return false;   // while building, other leaders only show under the Leaders chip
  if (F.colors.size && !c.co.some(x=>F.colors.has(x))) return false;
  if (L && c.c !== "L" && !sharesColor(c, L)) return false;
  if (F.costs.size && !F.costs.has(c.k ?? 0)) return false;
  if (F.blocks && F.blocks.size && !F.blocks.has(c.b)) return false;
  if (F.counter === "none" && c.ct) return false;
  if (F.counter === "has" && !c.ct) return false;
  if ((F.counter === "1000" || F.counter === "2000") && String(c.ct) !== F.counter) return false;
  for (const g of F.tags) if (!c._tags.has(g)) return false;
  if (F.type){ const t = F.type.toLowerCase(); if (!c._types.includes(t)) return false; }
  if (F.set && !c.v.some(v=>v[1]===F.set)) return false;
  if (S.prefs.pool === "std" && (!standardOK(c) || c.ban)) return false;
  if (S.prefs.pool === "noban" && c.ban) return false;
  return true;
}
const CMP_RANK = {A:0, U:1, B:2, C:3};
let leaderSections = false;
function results(){
  const d = deck(); const DL = ctx === "build" && d.leader ? BY.get(d.leader) : null;
  const L = DL && FB.lock ? DL : null;
  const myLeaders = new Set(leaderGroups().groups.map(g=>g.L.i));
  const PQ = parseQ(F.q), toks = PQ.toks;
  lastSynTags = F.exact ? [] : [...new Set(toks.flatMap(t => SYN[t] || []))];
  softPhrase = PQ.soft;
  const out = [];
  for (const c of CARDS){
    if (!passFilters(c, L, ctx === "build")) continue;
    if (PQ.quoted.length && !PQ.quoted.every(p => phraseIn(c, p))) continue;
    const sc = toks.length ? scoreCard(c, toks) : (PQ.quoted.length ? 50 : 0);
    if (sc < 0) continue;
    out.push({c, sc, ph: softPhrase ? phraseIn(c, softPhrase) : true, cm: (S.prefs.compat && DL) ? compat(c) : null, lg: c.c === "L" ? (isFav(c.i) ? 0 : myLeaders.has(c.i) ? 1 : 2) : 3});
  }
  leaderSections = out.length > 0 && out.every(r => r.c.c === "L") && S.prefs.sort === "rel";
  const sort = S.prefs.sort;
  const byCost = (a,b) => ((a.c.k??0)-(b.c.k??0)) || (a.c._order-b.c._order);
  let f;
  if (sort === "rel"){
    f = (a,b) => {
      if (leaderSections && a.lg !== b.lg) return a.lg - b.lg;
      if (a.cm || b.cm){ const r = (a.cm?CMP_RANK[a.cm.st]:-1) - (b.cm?CMP_RANK[b.cm.st]:-1); if (r) return r; }
      return (b.sc - a.sc) || byCost(a,b);
    };
  } else if (sort === "costA") f = byCost;
  else if (sort === "costD") f = (a,b)=>((b.c.k??0)-(a.c.k??0)) || (a.c._order-b.c._order);
  else if (sort === "pow") f = (a,b)=>((b.c.p??0)-(a.c.p??0)) || byCost(a,b);
  else if (sort === "color") f = (a,b)=>(COLORS.indexOf(a.c.co[0])-COLORS.indexOf(b.c.co[0])) || byCost(a,b);
  else if (sort === "num") f = (a,b)=>a.c._order-b.c._order;
  else if (sort === "name") f = (a,b)=>a.c.n.localeCompare(b.c.n) || byCost(a,b);

}

/* ================= deck analysis ================= */
function deckRows(d){
  return Object.entries(d.cards).map(([id,v]) => ({c:BY.get(id), q:v.q, art:v.art||""})).filter(r=>r.c)
    .sort((a,b)=>"CES".indexOf(a.c.c)-"CES".indexOf(b.c.c) || (a.c.k??0)-(b.c.k??0) || a.c._order-b.c._order);
}
function issuesFor(d){
  const out = [], L = d.leader && BY.get(d.leader), rows = deckRows(d), n = deckCount(d);
  if (!L) out.push(["bad","No leader yet. Pick one from Cards → Leaders."]);
  if (n !== 50) out.push([n>50?"bad":"warn", `Deck has ${n} of 50 cards.`]);
  for (const r of rows){
    if (r.q > limitFor(r.c)) out.push(["bad", `${r.c.n} (${r.c.i}): ${r.q} copies. The maximum is 4.`]);
    if (L && !sharesColor(r.c, L)) out.push(["warn", `${r.c.n} (${r.c.i}) doesn't share a color with your leader.`]);
    if (r.c.ban) out.push(["bad", `${r.c.n} (${r.c.i}) is banned.`]);
    if (r.c.c === "L") out.push(["bad", `${r.c.n} is a leader card in the main deck.`]);
  }
  if (L?.ban) out.push(["bad", `Your leader ${L.n} is banned.`]);
  const ids = new Set([...rows.map(r=>r.c.i), d.leader]);
  for (const [a,b] of META.pairs) if (ids.has(a) && ids.has(b)) out.push(["bad", `${BY.get(a).n} (${a}) and ${BY.get(b).n} (${b}) can't be in the same deck.`]);
  const old = rows.filter(r=>!standardOK(r.c));
  if (old.length) out.push(["info", `${old.length} card${old.length>1?"s have":" has"} rotated out of Standard (Block 1, not on Bandai's exception list): ${old.slice(0,4).map(r=>r.c.i).join(", ")}${old.length>4?"…":""}. Fine for Extra format.`]);
  if (L?.ru){
    for (const rule of L.ru){
      out.push(["info", "Leader rule: " + rule.replace("Under the rules of this game, ","")]);
      const m = rule.match(/cannot include (cards|Events|Characters) with a cost of (\d+) or more/);
      if (m){
        const lim = +m[2], cat = {cards:null, Events:"E", Characters:"C"}[m[1]];
        const bad = rows.filter(r => (cat===null || r.c.c===cat) && (r.c.k??0) >= lim);
        if (bad.length) out.push(["bad", `Breaks the leader rule: ${bad.map(r=>r.c.n).join(", ")}.`]);
      }
    }
  }
  if (!out.some(o=>o[0]==="bad"||o[0]==="warn")) out.unshift(["ok","Deck is legal: one leader, 50 cards, copy limits and colors check out."]);
  return out;
}
function statsFor(d){
  const rows = deckRows(d); const n = deckCount(d);
  const curve = Array(11).fill(0), ctr = {0:0,1000:0,2000:0}, cats = {C:0,E:0,S:0}, types = {}, abil = {}, colors = {};
  let trig = 0, ctrTotal = 0, costSum = 0;
  const AB = ["rush","blocker","banish","double","ko","rest","bounce","bottom","powdown","draw","search","donadd","active","play"];
  for (const r of rows){
    const c = r.c, q = r.q;
    curve[Math.min(10, c.k ?? 0)] += q; costSum += (c.k??0)*q;
    ctr[c.ct||0] = (ctr[c.ct||0]||0) + q; ctrTotal += (c.ct||0)*q;
    cats[c.c] = (cats[c.c]||0) + q;
    if (c.tr) trig += q;
    for (const t of c.t) types[t] = (types[t]||0) + q;
    for (const a of AB) if (c._tags.has(a)) abil[a] = (abil[a]||0) + q;
    for (const col of c.co) colors[col] = (colors[col]||0) + q;
  }
  let maxCost = 0; curve.forEach((v,i)=>{ if (v) maxCost = i; });
  return {n, curve: curve.slice(0, Math.max(maxCost, 7)+1), ctr, cats, types, abil, colors, trig, ctrTotal, avg: n ? (costSum/n) : 0, uniq: rows.length};
}
function hbars(obj, labelFn, max){
  const ent = Object.entries(obj).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]).slice(0, max||8);
  if (!ent.length) return `<p class="muted">Nothing yet.</p>`;
  const top = ent[0][1];
  return `<div class="bars">${ent.map(([k,v])=>`<div class="hbar"><span class="lbl">${esc(labelFn?labelFn(k):k)}</span><span class="track"><span class="fill" style="display:block;width:${Math.round(v/top*100)}%"></span></span><span class="num">${v}</span></div>`).join("")}</div>`;
}
function statsHTML(d){
  const s = statsFor(d);
  const top = Math.max(1, ...s.curve);
  const curve = `<div class="curve" style="--n:${s.curve.length}" role="img" aria-label="Cost curve: ${s.curve.map((v,i)=>`${v} at cost ${i}${i===10?"+":""}`).join(", ")}">${s.curve.map(v=>`<div class="col"><span class="v">${v||""}</span><span class="b${v?"":" zero"}" style="height:${v/top*100}%"></span></div>`).join("")}</div>
    <div class="curvex" style="--n:${s.curve.length}">${s.curve.map((_,i)=>`<span>${i===10?"10+":i}</span>`).join("")}</div>`;
  return `<div class="stats">
    <div class="statgrid">
      <div class="stat"><b>${s.avg.toFixed(2)}</b><span>Avg cost</span></div>
      <div class="stat"><b>${s.trig}</b><span>Triggers</span></div>
      <div class="stat"><b>${(s.ctrTotal/1000).toFixed(0)}k</b><span>Total counter</span></div>
      <div class="stat"><b>${s.uniq}</b><span>Unique cards</span></div>
    </div>
    <div><div class="h3" style="margin-top:4px">Cost curve</div>${curve}</div>
    <div class="statgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="stat"><b>${s.ctr[0]||0}</b><span>No counter</span></div>
      <div class="stat"><b>${s.ctr[1000]||0}</b><span>+1000</span></div>
      <div class="stat"><b>${s.ctr[2000]||0}</b><span>+2000</span></div>
    </div>
    <div class="statgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="stat"><b>${s.cats.C}</b><span>Characters</span></div>
      <div class="stat"><b>${s.cats.E}</b><span>Events</span></div>
      <div class="stat"><b>${s.cats.S}</b><span>Stages</span></div>
    </div>
    <div><div class="h3" style="margin-top:4px">Types &amp; traits</div>${hbars(s.types)}</div>
    <div><div class="h3" style="margin-top:4px">Abilities</div>${hbars(s.abil, k=>TAGLABEL[k], 14)}</div>
    <div><div class="h3" style="margin-top:4px">Colors</div>${hbars(s.colors)}</div>
  </div>`;
}

/* ================= import / export ================= */
const ID_RX = /(?:^|[^A-Za-z0-9]|(?<=\d)[x×])((?:OP|ST|EB|PRB|P)\d{0,2}-\d{3})(_[pr]\d+)?(?!\d)/i;
function parseList(text){
  const found = new Map(), errors = [], notes = []; let leader = null;
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if (!line) continue;
    const m = line.match(ID_RX);
    if (!m){ if (/\d/.test(line) && /[a-z]/i.test(line) && !/^(leader|characters?|events?|stages?|main|deck)\b/i.test(line)) notes.push(`Skipped a line with no card number: “${line.slice(0,40)}”`); continue; }
    const id = m[1].toUpperCase(), art = (m[2]||"").toLowerCase();
    let q = 1; const qm = line.match(/^(\d+)\s*[x×]?\s*/i) || line.match(/[x×]\s*(\d+)\s*$/i) || line.match(/\s(\d+)\s*$/);
    if (qm) q = +qm[1]; else notes.push(`No quantity on “${line.slice(0,30)}”, so it counts as 1.`);
    const c = BY.get(id);
    if (!c){ errors.push(`Card not found: ${id}`); continue; }
    if (c.c === "L"){ if (leader && leader !== id) notes.push(`More than one leader listed. Using ${BY.get(leader).n}.`); else leader = id; continue; }
    if (found.has(id)){ notes.push(`${id} listed more than once. Combined the copies.`); found.get(id).q += q; }
    else found.set(id, {q, art});
  }
  const cards = {}; let n = 0; for (const [id,v] of found){ cards[id] = v; n += v.q; }
  return {leader, cards, n, errors, notes};
}
function exportList(d, fmt){
  const rows = deckRows(d), L = d.leader && BY.get(d.leader), lines = [];
  const line = (q, c) => fmt === "sim" ? `${q}x${c.i}` : fmt === "ids" ? `${q} ${c.i}` : `${q} ${c.i} ${c.n}`;
  if (L) lines.push(line(1, L));
  for (const r of rows) lines.push(line(r.q, r.c));
  return lines.join("\n");
}
async function copyText(text, el){
  try{ await navigator.clipboard.writeText(text); toast("Copied"); }
  catch(e){ if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Press Copy on your keyboard or menu"); }
}

function shrinkPhoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const s = Math.min(1, 520 / Math.max(im.width, im.height * 0.72));
      const cv = document.createElement("canvas"); cv.width = Math.round(im.width*s); cv.height = Math.round(im.height*s);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.8)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    im.src = url;
  });
}

// What to buy for a Buy List: for each card, how many each selected deck still needs after My Collection,
// plus extra copies added by hand. "all" = build every deck at once (owned copies go to the first deck listed first);
// "share" = you'll move copies between decks, so you only need enough for the deck that runs the most.
function buyRows(w){
  const decks = w.decks.map(id=>S.decks.find(d=>d.id===id)).filter(Boolean);
  const runs = new Map();
  const addRun = (id, d, q) => { if (!runs.has(id)) runs.set(id, []); runs.get(id).push([d, q]); };
  for (const d of decks){ if (d.leader) addRun(d.leader, d, 1); for (const [id,v] of Object.entries(d.cards)) addRun(id, d, v.q); }
  const wants = w.incWant ? new Set((S.want||[]).filter(id => !(S.owned[id] > 0))) : new Set();
  const ids = new Set([...runs.keys(), ...Object.keys(w.items).filter(k=>w.items[k]>0), ...wants]);
  const rows = []; let covered = 0;
  const perDeck = new Map(decks.map(d=>[d.id, 0]));
  for (const id of ids){
    const c = BY.get(id); if (!c) continue;
    const owned = S.owned[id]||0, extra = w.items[id]||0, rs = runs.get(id) || [];
    const parts = []; let fromDecks = 0;
    if (w.mode === "share" && rs.length > 1){
      const max = Math.max(...rs.map(r=>r[1])); fromDecks = Math.max(0, max - owned);
      if (fromDecks){ const top = rs.find(r=>r[1]===max)[0]; parts.push([`${fromDecks} shared by ${rs.map(r=>esc(r[0].name)).join(" & ")}`, top.id, fromDecks]); }
    } else {
      let left = owned;
      for (const [d,q] of rs){ const use = Math.min(left, q); left -= use; const need = q - use; if (need){ parts.push([`${need} for ${esc(d.name)}`, d.id, need]); fromDecks += need; } }
    }
    for (const p of parts) perDeck.set(p[1], perDeck.get(p[1]) + p[2]);
    const wantOne = wants.has(id) && !fromDecks && !extra ? 1 : 0;      // a Wish List card nothing else already covers
    if (wantOne) parts.push(["1 from Wish List"]);
    const total = fromDecks + extra + wantOne;
    if (rs.length && !total) covered++;
    if (total) rows.push({c, total, parts: parts.map(p=>p[0]), extra});
  }
  rows.sort((a,b)=>"LCES".indexOf(a.c.c)-"LCES".indexOf(b.c.c) || (a.c.k??0)-(b.c.k??0) || a.c._order-b.c._order);
  return {rows, decks, covered, perDeck, total: rows.reduce((n,r)=>n+r.total,0)};
}

/* ================= look: background colors & your own photos ================= */
// Colors: Match phone (sand / warm black), Light, In-between (stone), Dark.
// Photos are kept on this device in IndexedDB (too big for normal storage). With a photo on, text sits on a
// frosted backing; Auto picks a light or dark backing from the photo's brightness.
const LOOKS = [["phone","Match phone","linear-gradient(135deg,#E4D8C0 0 50%,#12110F 50% 100%)"],["light","Light","#E4D8C0"],["stone","In-between","#A89C86"],["dark","Dark","#12110F"]];
let bgPhotos = [], bgURLs = new Map(), memOnly = false;
const IDB = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => { try { const r = indexedDB.open("bountyboard-media", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("bg", {keyPath: "id"});
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); },
  run(mode, fn){ return this.open().then(db => new Promise((res, rej) => { const t = db.transaction("bg", mode), q = fn(t.objectStore("bg")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); })); }
};
async function loadPhotos(){
  try { bgPhotos = await IDB.run("readonly", st => st.getAll()) || []; } catch(e){ memOnly = true; }
  for (const p of bgPhotos) if (!bgURLs.has(p.id)) bgURLs.set(p.id, URL.createObjectURL(p.blob));
}
async function storePhoto(p){ if (!memOnly) { try { await IDB.run("readwrite", st => st.put(p)); } catch(e){ memOnly = true; } } }
async function dropPhoto(id){ if (!memOnly) { try { await IDB.run("readwrite", st => st.delete(id)); } catch(e){} } }
function photoFromFile(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.width, im.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      const sm = document.createElement("canvas"); sm.width = sm.height = 24; const sx = sm.getContext("2d"); sx.drawImage(im, 0, 0, 24, 24);
      const px = sx.getImageData(0, 0, 24, 24).data; let L = 0;
      const lin = v => { v /= 255; return v <= .04045 ? v/12.92 : ((v+.055)/1.055)**2.4; };
      for (let j = 0; j < px.length; j += 4) L += .2126*lin(px[j]) + .7152*lin(px[j+1]) + .0722*lin(px[j+2]);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res({id: uid(), blob: b, lum: L/(px.length/4), x: 50, y: 50, added: Date.now()}) : rej(new Error("encode")), "image/jpeg", 0.85);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    im.src = url;
  });
}

// Combine two saves: builds by id (newer edit wins, deleted stays deleted), the higher owned count per card,
// lists and Treasure Box by id, pools and favorites merged; this device's settings win.
function combine(a, b){
  const gone = Object.assign({}, b.gone||{}, a.gone||{});
  const byId = new Map();
  for (const d of [...(b.decks||[]), ...(a.decks||[])]){ if ((gone[d.id] && gone[d.id] >= (d.updated||0)) || d.sample) continue; const o = byId.get(d.id); if (!o || (d.updated||0) >= (o.updated||0)) byId.set(d.id, d); }
  const owned = Object.assign({}, b.owned||{}); for (const [k,v] of Object.entries(a.owned||{})) owned[k] = Math.max(v, owned[k]||0);
  const union = (x, y, key) => { const m = new Map(); for (const it of [...(y||[]), ...(x||[])]) m.set(key ? it[key] : JSON.stringify(it), it); return [...m.values()]; };

  const decks = [...byId.values()];
  return Object.assign({}, b, a, {decks: decks.length ? decks : (a.decks||[]), owned, gone, pools,
    junk: union(a.junk, b.junk, "id").filter(j => !byId.has(j.id)),
    want: [...new Set([...(a.want||[]), ...(b.want||[])])],
    wish: union(a.wish, b.wish, "id"), treasure: union(a.treasure, b.treasure), favLeaders: [...new Set([...(a.favLeaders||[]), ...(b.favLeaders||[])])]});
}

function authErr(e){

  if (/not confirmed/i.test(m)) return "Confirm your email first: open the link we sent you, then sign in. Link expired? Tap “Resend confirmation email”.";
  if (/already registered/i.test(m)) return "There's already an account with that email. Sign in instead.";
  if (/password.*(6|characters|weak)/i.test(m)) return "Use a password with at least 8 characters.";
  if (/rate|too many/i.test(m)) return "Too many tries. Wait a minute and try again.";

}
function openAccount(msg, bad){
  if (!sb){ sheet(`<div class="ebhead"><span><span class="mono muted" style="font-size:11px;letter-spacing:.08em">ACCOUNT</span><b>Sign in</b></span><button class="btn primary" data-ac="done">Done</button></div>
      <p class="authmsg">Sign-in works in the installed app. This preview can't reach the server, so your decks are saved on this device only.</p>`, "Account").addEventListener("click", e => { if (e.target.closest("[data-ac=done]")) closeSheet(); }); return; }
  const when = syncMeta.at ? new Date(syncMeta.at).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "";
  const status = sbState === "error" ? `<span style="color:var(--warn)">Couldn't reach the server. Your changes are safe on this device and will sync when you're back online.</span>` : syncMeta.dirty ? "Saving…" : when ? `Synced · ${when}` : "Syncing…";
  const body = recovering ? `<label class="fld"><span>New password</span><input type="password" id="acPw" autocomplete="new-password" minlength="8" autofocus></label>
      <button class="btn primary" data-ac="setpw" style="width:100%;justify-content:center;height:46px">Save new password</button>`
    : sbUser ? `<p style="margin:0 0 4px">Signed in as <b>${esc(sbUser.email)}</b></p><p class="muted" style="margin:0 0 16px;font-size:13.5px">${status}</p>
      <div class="row" style="gap:8px"><button class="btn" data-ac="sync">Sync now</button><button class="btn" data-ac="out">Sign out</button></div>
      <p class="muted" style="font-size:12.5px;margin:16px 0 0">Builds, collection, Buy Lists, Treasure Box, pools and settings sync to your account. Background photos stay on each device.</p>`
    : `<p class="muted" style="margin:0 0 14px;font-size:14px">Sign in to keep your decks safe and the same on all your devices.</p>
      <label class="fld"><span>Email</span><input type="email" id="acEmail" autocomplete="email" inputmode="email" autofocus></label>
      <label class="fld"><span>Password</span><input type="password" id="acPw" autocomplete="current-password"></label>
      <div class="row" style="gap:8px"><button class="btn primary" data-ac="in" style="flex:1;justify-content:center;height:46px">Sign in</button><button class="btn" data-ac="up" style="flex:1;justify-content:center;height:46px">Create account</button></div>
      <div class="row" style="gap:16px;margin-top:14px"><button class="linkbtn" data-ac="forgot">Forgot password?</button><button class="linkbtn" data-ac="resend">Resend confirmation email</button></div>`;
  const sc = sheet(`<div class="ebhead"><span><span class="mono muted" style="font-size:11px;letter-spacing:.08em">BOUNTY BOARD</span><b>${recovering ? "New password" : sbUser ? "Account" : "Sign in"}</b></span><button class="btn" data-ac="done">Close</button></div>
    ${msg ? `<p class="authmsg${bad ? " bad" : ""}" role="status">${esc(msg)}</p>` : ""}${body}`, "Account");
  const val = id => ($("#"+id, sc) || {}).value || "";
  sc.addEventListener("click", async e => {
    const t = e.target.closest("[data-ac]"); if (!t) return; const a = t.dataset.ac;
    if (a === "done"){ closeSheet(); return; }
    const email = val("acEmail").trim(), pw = val("acPw");
    try {
      if (a === "in"){ if (!email || !pw) return openAccount("Enter your email and password.", true);
        t.disabled = true; const {error} = await sb.auth.signInWithPassword({email, password: pw}); if (error) throw error; openAccount("Signed in. Your decks are syncing."); }
      else if (a === "up"){ if (!email || pw.length < 8) return openAccount("Enter your email and a password with at least 8 characters.", true);
        t.disabled = true; const {data, error} = await sb.auth.signUp({email, password: pw, options: {emailRedirectTo: location.origin + location.pathname}}); if (error) throw error;
        openAccount(data.session ? "Account created. Your decks are syncing." : `Almost done: we sent a link to ${email}. Open it on this device, then sign in.`); }
      else if (a === "forgot"){ if (!email) return openAccount("Type your email above first, then tap “Forgot password?”.", true);
        const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname}); if (error) throw error; openAccount(`We sent a reset link to ${email}.`); }
      else if (a === "resend"){ if (!email) return openAccount("Type your email above first, then tap “Resend confirmation email”.", true);
        const {error} = await sb.auth.resend({type: "signup", email, options: {emailRedirectTo: location.origin + location.pathname}}); if (error) throw error; openAccount(`We sent a new confirmation link to ${email}. It works for about an hour.`); }
      else if (a === "setpw"){ if (pw.length < 8) return openAccount("Use at least 8 characters.", true);
        const {error} = await sb.auth.updateUser({password: pw}); if (error) throw error; recovering = false; openAccount("Password changed. You're signed in."); }
      else if (a === "sync"){ await pull(); openAccount(sbState === "error" ? "" : "Up to date."); }
      else if (a === "out"){ await sb.auth.signOut(); syncMeta = {}; saveMeta(); openAccount("Signed out. Your decks stay on this device."); }
    } catch(err){ openAccount(authErr(err), true); }
  });
}
$("#acctBtn").onclick = () => openAccount();
function loadSupabase(){
  if (!/^https?:$/.test(location.protocol)) return;
  const sc = document.createElement("script");
  sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
  sc.onload = async () => {
    try { sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "bountyboard.auth"}}); } catch(e){ sb = null; return; }
    let first = true;
    sb.auth.onAuthStateChange((ev, session) => {
      const was = sbUser && sbUser.id; sbUser = session ? session.user : null; setSync(sbUser ? sbState : "off");
      if (ev === "PASSWORD_RECOVERY"){ recovering = true; openAccount("Choose a new password."); return; }
      if (sbUser && (first || was !== sbUser.id)) setTimeout(pull, 0);
      first = false;
    });
  };
  document.head.appendChild(sc);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && sbUser) pull(); else if (document.visibilityState === "hidden" && sbUser && syncMeta.dirty) push(); });
(() => { const m = sessionStorage.getItem("bb.toast"); if (m){ sessionStorage.removeItem("bb.toast"); setTimeout(() => toast(m), 300); } })();
loadSupabase();
if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{});
function renderAll(){ compatCache.clear(); renderQuick(); renderResults(); renderDeckViews(); renderDecks(); renderLists(); updateChip(); }
renderAll();
show(location.hash.slice(1) || "cards");
})();
